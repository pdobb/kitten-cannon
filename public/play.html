<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8ec8ee" />
  <title>Kitten Cannon</title>
  <!-- Fresh share URL: clears workers/caches, then opens game.html (never the
       stuck pre-classic index shell). -->
  <script>
    (function () {
      var dest = './game.html';
      var went = false;
      function go() {
        if (went) return;
        went = true;
        location.replace(dest);
      }
      var chain = Promise.resolve();
      if (navigator.serviceWorker) {
        chain = chain.then(function () {
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
          });
        });
      }
      if (window.caches && caches.keys) {
        chain = chain.then(function () {
          return caches.keys().then(function (keys) {
            return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
          });
        });
      }
      chain.then(go, go);
      setTimeout(go, 1200);
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; background: #8ec8ee; color: #2b2118; padding: 24px;">
  <p>Opening Kitten Cannon…</p>
  <p><a href="./game.html">Tap here if nothing happens</a></p>
</body>
</html>
